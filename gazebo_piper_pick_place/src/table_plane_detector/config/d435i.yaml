table_plane_detector:
  ros__parameters:
    processing_rate_hz: 5.0

    depth_min_m: 0.30
    depth_max_m: 1.80
    crop_min_x_m: -0.75
    crop_max_x_m: 0.75
    crop_min_y_m: -0.75
    crop_max_y_m: 0.75

    voxel_size_m: 0.005
    ransac_distance_threshold_m: 0.008
    max_iterations: 500
    minimum_inlier_count: 5000
    minimum_inlier_ratio: 0.25
    maximum_normal_error_deg: 10.0
    minimum_plane_distance_m: 0.40
    maximum_plane_distance_m: 1.50
    maximum_rms_error_m: 0.008
    minimum_plane_extent_m: 0.30

    normal_reference_frame: base_link
    expected_normal_x: 0.0
    expected_normal_y: 0.0
    expected_normal_z: 1.0
    tf_timeout_s: 0.10
    allow_fixed_normal_fallback: false

    temporal_window_size: 20
    minimum_tracking_frames: 5
    maximum_failed_frames: 5
    maximum_distance_jump_m: 0.03
    maximum_normal_jump_deg: 5.0

    publish_inliers: false
    publish_marker: true
    marker_size_m: 0.60
